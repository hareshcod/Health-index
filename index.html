<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Score Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏥 Health Score Calculator</h1>
        <p class="subtitle">Assess your overall health wellness</p>

        <form id="healthForm">
            <div class="input-group">
                <label>Age (years)</label>
                <input type="number" id="age" required min="1" max="120">
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Weight (kg)</label>
                    <input type="number" id="weight" required min="1" step="0.1">
                </div>
                <div class="input-group">
                    <label>Height (cm)</label>
                    <input type="number" id="height" required min="1" step="0.1">
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Resting Heart Rate (bpm)</label>
                    <input type="number" id="heartRate" required min="30" max="200">
                </div>
                <div class="input-group">
                    <label>Blood Pressure</label>
                    <select id="bloodPressure" required>
                        <option value="">Select...</option>
                        <option value="5">Low (&lt;90/60)</option>
                        <option value="10">Normal (90-120/60-80)</option>
                        <option value="7">Elevated (120-129/&lt;80)</option>
                        <option value="5">High Stage 1 (130-139/80-89)</option>
                        <option value="3">High Stage 2 (≥140/≥90)</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>Sleep (hours/night)</label>
                    <input type="number" id="sleep" required min="0" max="24" step="0.5">
                </div>
                <div class="input-group">
                    <label>Exercise (days/week)</label>
                    <input type="number" id="exercise" required min="0" max="7">
                </div>
            </div>

            <div class="input-group">
                <label>Smoking Status</label>
                <select id="smoking" required>
                    <option value="">Select...</option>
                    <option value="10">Non-smoker</option>
                    <option value="7">Former smoker (&gt;1 year)</option>
                    <option value="4">Former smoker (&lt;1 year)</option>
                    <option value="2">Current smoker</option>
                </select>
            </div>

            <button type="submit">Calculate Health Score</button>
        </form>

        <div class="result" id="result">
            <div class="score-label">Your Health Score</div>
            <div class="score-display" id="scoreDisplay">0</div>
            <div class="health-status" id="healthStatus"></div>
            
            <div class="scale-container">
                <div class="scale-label">Health Score Scale (1-10)</div>
                <div class="scale-bar">
                    <div class="scale-marker" id="scaleMarker"></div>
                </div>
                <div class="scale-numbers">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                    <span>6</span>
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                    <span>10</span>
                </div>
            </div>
            
            <div class="bmi-info" id="bmiInfo"></div>
            
            <div class="calculations" id="calculations">
                <div class="calc-title">📊 Calculation Breakdown</div>
                <div id="calcDetails"></div>
            </div>
            
            <div class="feedback-section" id="feedbackSection">
                <div class="feedback-title">💡 Personalized Feedback & Tips</div>
                <div id="feedbackContent"></div>
            </div>
            
            <button class="download-btn" id="downloadBtn" onclick="downloadPDF()">
                <span>📄</span>
                <span>Download Health Report (PDF)</span>
            </button>
        </div>
        
        <button class="download-btn" id="downloadBtn2" onclick="downloadPDF()" style="display: none; margin-top: 15px;">
            <span>📥</span>
            <span>Download Complete Report as PDF</span>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
